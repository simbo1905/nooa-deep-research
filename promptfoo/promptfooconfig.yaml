description: SwarmForge target-disambiguation digital twin
providers:
  - id: openai:chat:mistral-medium-3.5-128b
    config:
      apiBaseUrl: https://api.scaleway.ai/5647c6fe-ecc5-4277-9e5e-9ec56b1ac2c8/v1
      temperature: 0.2
      max_tokens: 800
      response_format:
        type: json_object
prompts:
  - file://prompts/disambiguate-baseline.txt
  - file://prompts/disambiguate-gated.txt
tests:
  - description: Uncle Robert Martin resolves to the GitHub project, not a same-name lookalike
    vars:
      user_question: tell me about the swarmforge project by uncle robert martin
    assert:
      - type: is-json
      - type: javascript
        value: |
          const result = JSON.parse(output);
          return result.canonical_url === 'https://github.com/unclebob/swarm-forge';
      - type: javascript
        value: |
          const result = JSON.parse(output);
          return /Robert|Uncle Bob|github/i.test(result.reason || '');
      - type: javascript
        value: |
          if (!context.prompt.label?.includes('gated')) return true;
          const result = JSON.parse(output);
          return Array.isArray(result.rejected_urls) && result.rejected_urls.some((url) => /forbes|tradewindai|defensescoop|swarmforge\.ai/.test(url));
