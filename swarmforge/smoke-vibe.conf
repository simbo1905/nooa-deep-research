# OpenCode remains first because it is an interactive receiver and owns swarm
# cleanup.  Vibe's programmatic mode is intentionally one-shot, so it is the
# bounded sender rather than a receiver waiting for a later handoff.
window smoke-vibe-coder opencode smoke-vibe-coder task --model opencode/deepseek-v4-pro
# The standard SwarmForge instruction requires a recursive constitution read
# before the one-line task.  These bounded caps leave room for that mandatory
# context without enabling unattended approval.
window smoke-vibe-specifier vibe master task --max-turns 8 --max-tokens 16384 --max-price 1.00
