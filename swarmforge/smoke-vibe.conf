# Claude remains first because it is the persistent receiver and owns swarm
# cleanup. Vibe's programmatic mode is intentionally one-shot, so it is the
# bounded sender rather than a receiver waiting for a later handoff.
window smoke-vibe-coder claude smoke-vibe-coder task --model sonnet
# The driver selects the smoke-only role prompt profile.  Its short role prompt
# carries all safety constraints, so this deliberately tiny task needs no
# recursive NOOA constitution bootstrap.
window smoke-vibe-specifier vibe master task --max-turns 2 --max-tokens 8192 --max-price 0.25
