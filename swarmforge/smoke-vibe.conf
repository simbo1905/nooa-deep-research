# Codex remains first because it is an authenticated interactive receiver and
# owns swarm cleanup. Vibe's programmatic mode is intentionally one-shot, so
# it is the bounded sender rather than a receiver waiting for a later handoff.
window smoke-vibe-coder codex smoke-vibe-coder task
# The standard SwarmForge instruction requires a recursive constitution read
# before the one-line task.  These bounded caps leave room for that mandatory
# context without enabling unattended approval.
window smoke-vibe-specifier vibe master task --max-turns 8 --max-tokens 32768 --max-price 1.00
